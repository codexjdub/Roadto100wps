<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road to 100</title>
  <meta name="description" content="A typing trainer that finds what slows you down and drills it: tests, real quotes and passages, weak-spot drills and a tutorial.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='8' width='26' height='17' rx='4' fill='%232a78d6'/%3E%3Crect x='7' y='12' width='3' height='3' rx='1' fill='white'/%3E%3Crect x='12' y='12' width='3' height='3' rx='1' fill='white'/%3E%3Crect x='17' y='12' width='3' height='3' rx='1' fill='white'/%3E%3Crect x='22' y='12' width='3' height='3' rx='1' fill='white'/%3E%3Crect x='9' y='18' width='14' height='3' rx='1' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css?v=1.8">
  <script>window.APP_VERSION = "1.8";</script>
  <script>
    // Apply the saved theme before first paint so the page doesn't flash.
    try {
      var saved = JSON.parse(localStorage.getItem("rt100.v1") || "{}");
      var mode = saved.settings && saved.settings.themeMode;
      if (mode === "light" || mode === "dark") document.documentElement.dataset.theme = mode;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#/home" aria-label="Road to 100, home">
      <span class="brand-mark" aria-hidden="true">100</span>
      <span class="brand-name">road to 100</span>
    </a>
    <nav class="nav" aria-label="Main">
      <a href="#/home" data-route="home">Home</a>
      <a href="#/type" data-route="type">Practice</a>
      <a href="#/routine" data-route="routine">Routine</a>
      <a href="#/learn" data-route="learn">Lessons</a>
      <a href="#/progress" data-route="progress">Progress</a>
      <a href="#/about" data-route="about">About</a>
    </nav>
    <div class="top-right">
      <span class="goal-chip" id="goal-chip" hidden></span>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch between light and dark mode" title="Switch between light and dark mode">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <div class="banner" id="storage-banner" hidden>
    This browser isn't letting the page save, so your history will be lost when you close the tab.
  </div>

  <main id="app" tabindex="-1"></main>

  <footer class="foot">
    <span><kbd>tab</kbd> new test</span>
    <span><kbd>esc</kbd> restart</span>
    <span><kbd>option</kbd>+<kbd>backspace</kbd> delete word</span>
    <span class="foot-note">Your history stays in this browser.<span class="foot-version" id="version" role="status"></span></span>
  </footer>

  <script src="js/words.js?v=1.8"></script>
  <script src="js/texts.js?v=1.8"></script>
  <script src="js/storage.js?v=1.8"></script>
  <script src="js/stats.js?v=1.8"></script>
  <script src="js/charts.js?v=1.8"></script>
  <script src="js/engine.js?v=1.8"></script>
  <script src="js/drills.js?v=1.8"></script>
  <script src="js/tutorial.js?v=1.8"></script>
  <script src="js/routine.js?v=1.8"></script>
  <script src="js/home.js?v=1.8"></script>
  <script src="js/app.js?v=1.8"></script>
</body>
</html>
