<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Road to 100 browser tests</title>
  <style>
    body { margin: 16px; font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: #f9f9f7; color: #0b0b0b; }
    #summary { font-weight: 600; }
    #summary[data-status="pass"], .pass { color: #006300; }
    #summary[data-status="fail"], .fail { color: #d03b3b; }
    li .why { color: #52514e; white-space: pre-wrap; }
    iframe { width: 1000px; max-width: 100%; height: 640px; border: 1px solid #c3c2b7; background: #fff; }
  </style>
</head>
<body>
  <h1>Browser tests</h1>
  <p>Drives the real app below with simulated keypresses. It uses separate test storage, so your own history is never touched.</p>
  <p id="summary" data-status="running">Running...</p>
  <ol id="results"></ol>
  <iframe id="frame" title="The app under test"></iframe>
  <script src="browser.js"></script>
</body>
</html>
