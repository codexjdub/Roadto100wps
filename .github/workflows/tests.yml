name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Logic tests
        run: node --test tests/*.test.js

      - name: Browser tests (headless Chrome)
        run: bash tools/browser_tests.sh
